stages:
  download:
    cmd: python src/SEC_filings.py
    deps:
      - src/SEC_filings.py
    outs:
      - data/raw

  parse:
    cmd: python src/extract_pdf_text.py
    deps:
      - src/extract_pdf_text.py
      - data/raw
    outs:
      - data/parsed/Apple_10K_2023
      - data/parsed/Apple_10K_2024
      - data/parsed/ocr_summary.json

  tables:
    foreach:
      - { pdf: data/raw/Apple_10K_2023.pdf, name: Apple_10K_2023 }
      - { pdf: data/raw/Apple_10K_2024.pdf, name: Apple_10K_2024 }
    do:
      cmd: >
        python src/hybrid_tables.py --pdf ${item.pdf} --pages 1-300 --out data/parsed/tables/Hybrid/${item.name}
      deps:
        - src/hybrid_tables.py
        - ${item.pdf}
      outs:
        - data/parsed/tables/Hybrid/${item.name}

  layout:
    foreach:
      - { pdf: data/raw/Apple_10K_2023.pdf, name: Apple_10K_2023 }
      - { pdf: data/raw/Apple_10K_2024.pdf, name: Apple_10K_2024 }
    do:
      cmd: >
        python src/layout_detection.py --pdf ${item.pdf} --parsed-dir data/parsed
      deps:
        - src/layout_detection.py
        - ${item.pdf}
      outs:
        - data/parsed/layout/${item.name}

  docling:
    foreach:
      - { pdf: data/raw/Apple_10K_2023.pdf, name: Apple_10K_2023 }
      - { pdf: data/raw/Apple_10K_2024.pdf, name: Apple_10K_2024 }
    do:
      cmd: >
        python src/docling_basic.py --pdf ${item.pdf} --output data/parsed/docling
      deps:
        - src/docling_basic.py
        - ${item.pdf}
      outs:
        - data/parsed/docling/${item.name}

  export:
    foreach:
      - { pdf: data/raw/Apple_10K_2023.pdf, name: Apple_10K_2023 }
      - { pdf: data/raw/Apple_10K_2024.pdf, name: Apple_10K_2024 }
    do:
      cmd: >
        python src/provenance_tagging.py --pdf ${item.pdf} --out data/parsed/provenance/${item.name}
      deps:
        - src/provenance_tagging.py
        - ${item.pdf}
        - data/parsed/docling/${item.name}
      outs:
        - data/parsed/provenance/${item.name}

