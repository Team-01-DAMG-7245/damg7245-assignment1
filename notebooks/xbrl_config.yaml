# Configuration file for XBRL extraction and validation system

# Company and Filing Configuration
companies:
  apple:
    ticker: "AAPL"
    name: "Apple Inc"
    filing_years: [2023, 2024]
    filing_types: ["10-K", "10-Q"]
  
  microsoft:
    ticker: "MSFT" 
    name: "Microsoft Corporation"
    filing_years: [2023, 2024]
    filing_types: ["10-K"]

# Directory Paths
paths:
  xbrl_downloads: "data/xbrl"
  pdf_tables: "data/parsed/tables" 
  validation_output: "data/xbrl_validation"
  notebooks: "notebooks"

# XBRL Parser Configuration
parser:
  preferred_library: "arelle"  # Options: "arelle", "xml", "python-xbrl"
  
  # Financial concepts to extract (maps standard names to XBRL concepts)
  financial_concepts:
    Revenue:
      - "Revenue"
      - "Revenues" 
      - "SalesRevenueNet"
      - "RevenueFromContractWithCustomerExcludingAssessedTax"
    
    NetIncome:
      - "NetIncomeLoss"
      - "ProfitLoss"
      - "NetIncomeLossAvailableToCommonStockholdersBasic"
    
    TotalAssets:
      - "Assets"
      - "AssetsCurrent" 
      - "AssetsNoncurrent"
    
    GrossProfit:
      - "GrossProfit"
      - "GrossMargin"
    
    OperatingIncome:
      - "OperatingIncomeLoss"
      - "IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest"
    
    Cash:
      - "CashAndCashEquivalentsAtCarryingValue"
      - "Cash"
    
    TotalLiabilities:
      - "Liabilities"
      - "LiabilitiesAndStockholdersEquity"
    
    StockholdersEquity:
      - "StockholdersEquity"
      - "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest"

# PDF-XBRL Validation Configuration
validation:
  tolerance_percent: 5.0  # Percentage tolerance for matching
  
  # Text patterns to find financial concepts in PDF tables
  pdf_patterns:
    Revenue:
      - "revenue"
      - "net sales"
      - "total revenue"
      - "sales"
    
    NetIncome:
      - "net income"
      - "net earnings"
      - "profit"
      - "net profit"
    
    TotalAssets:
      - "total assets"
      - "assets total"
    
    GrossProfit:
      - "gross profit"
      - "gross margin"
    
    OperatingIncome:
      - "operating income"
      - "operating profit"
      - "income from operations"
    
    Cash:
      - "cash and cash equivalents"
      - "cash"
      - "cash equivalents"
    
    TotalLiabilities:
      - "total liabilities"
      - "liabilities total"
    
    StockholdersEquity:
      - "stockholders equity"
      - "shareholders equity"
      - "total equity"

# Automated Mapping Configuration
mapping:
  similarity_threshold: 0.3  # Minimum text similarity for automated mapping suggestions
  
  # Priority concepts (focus mapping efforts on these)
  priority_concepts:
    - "Revenue"
    - "NetIncome" 
    - "TotalAssets"
    - "Cash"

# Reporting Configuration
reporting:
  include_visualizations: true
  save_detailed_json: true
  generate_summary_csv: true
  
  # Quality thresholds for reporting
  thresholds:
    excellent: 80  # >= 80% match rate
    good: 60       # >= 60% match rate
    poor: 60       # < 60% match rate

# SEC EDGAR Configuration
sec:
  user_agent: "MyCompany myemail@company.com"
  rate_limit_seconds: 0.1  # Delay between requests
  max_retries: 3