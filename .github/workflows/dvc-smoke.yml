name: DVC Smoke Test

on:
  pull_request:
  push:
    branches: [ main, kundana ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc[ssh] pdfplumber camelot-py[cv] pytesseract layoutparser[torch] docling

      - name: Initialize DVC
        run: |
          dvc version
          dvc doctor

      - name: Dry-run DVC repro
        run: |
          dvc repro -n || true

